<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Custom dropdown fixture</title>
<!--
  Synthetic copy of the widget shape that cost run_20261115_180326 thirty-five
  "Could NOT fill" reports: an Element Plus style el-select. The control is a
  READONLY <input role=combobox aria-controls=...>, and its options live in a
  [role=listbox] teleported to the end of <body>, display:none until opened.
  Nothing here is from a real study: the questions and options are invented.

  It also reproduces the two labels the extractor used to scavenge from
  under <body>: a tracking pixel inside <noscript> (whose text content is its
  own markup) and the option list of the dropdown next to it.
-->
<style>
  body { font: 16px system-ui; margin: 24px; }
  .q { margin: 18px 0; }
  .el-input__inner { width: 320px; height: 32px; }
  .popper { display: none; position: absolute; background: #fff; z-index: 5;
            border: 1px solid #c8ccd4; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .popper [role=option] { padding: 6px 10px; cursor: pointer; }
  .popper [role=option]:hover { background: #eef3fb; }
  .scroller { max-height: 140px; overflow-y: auto; }
  .spacer { height: 900px; }
</style>
</head>
<body>

<div class="q">
  <label for="sel-colour">Which colour do you prefer for a kitchen wall?</label><br>
  <input class="el-input__inner" role="combobox" readonly placeholder="Select"
         aria-controls="pop-colour" aria-expanded="false" aria-haspopup="listbox"
         type="text" id="sel-colour" tabindex="0">
</div>

<div class="q">
  <label for="sel-often">How often do you repaint a room?</label><br>
  <input class="el-input__inner" role="combobox" readonly placeholder="Select"
         aria-controls="pop-often" aria-expanded="false" aria-haspopup="listbox"
         type="text" id="sel-often" tabindex="0">
</div>

<div class="q">
  <label for="sel-many">Which of these rooms did you paint last?</label><br>
  <input class="el-input__inner" role="combobox" readonly placeholder="Select"
         aria-controls="pop-many" aria-expanded="false" aria-haspopup="listbox"
         type="text" id="sel-many" tabindex="0">
</div>

<div class="q">
  <label for="why">Why did you choose that colour?</label><br>
  <textarea id="why" rows="3" cols="40"></textarea>
</div>

<!-- teleported poppers, exactly where the widget kit puts them -->
<noscript><img height="1" width="1" style="display:none" src="https://example.invalid/tr?id=000&amp;ev=PageView"></noscript>

<div class="popper" id="pop-colour" role="listbox">
  <div role="option">Warm white</div>
  <div role="option">Pale green</div>
  <div role="option">Deep blue</div>
  <div role="option">I have no preference</div>
</div>

<div class="popper" id="pop-often" role="listbox">
  <div role="option">Never</div>
  <div role="option">Every few years</div>
  <div role="option">Once a year</div>
  <div role="option">More than once a year</div>
</div>

<!-- a list taller than its own scroll box: the option wanted is off the
     bottom of the popup and has to be scrolled to inside it -->
<div class="popper scroller" id="pop-many" role="listbox">
  <div role="option">Kitchen</div>
  <div role="option">Bathroom</div>
  <div role="option">Hallway</div>
  <div role="option">Living room</div>
  <div role="option">Bedroom</div>
  <div role="option">Study</div>
  <div role="option">Dining room</div>
  <div role="option">Garage</div>
  <div role="option">Attic</div>
  <div role="option">Cellar</div>
</div>

<script>
// Behaves like the real widget: the popup is hidden until the control is
// clicked, appears after a short delay (an animation frame or two in the
// real one), writes the option text into the readonly input, and closes.
(function () {
  var open = null;
  function close() {
    if (!open) return;
    open.pop.style.display = 'none';
    open.cb.setAttribute('aria-expanded', 'false');
    open = null;
  }
  document.querySelectorAll('[role=combobox]').forEach(function (cb) {
    var pop = document.getElementById(cb.getAttribute('aria-controls'));
    cb.addEventListener('click', function () {
      if (open && open.cb === cb) { close(); return; }
      close();
      setTimeout(function () {
        var r = cb.getBoundingClientRect();
        pop.style.display = 'block';
        pop.style.left = (r.left + window.scrollX) + 'px';
        pop.style.top = (r.bottom + window.scrollY + 2) + 'px';
        pop.style.width = r.width + 'px';
        cb.setAttribute('aria-expanded', 'true');
        open = {cb: cb, pop: pop};
      }, 140);
    });
    pop.querySelectorAll('[role=option]').forEach(function (o) {
      o.addEventListener('click', function () {
        pop.querySelectorAll('[role=option]').forEach(function (x) {
          x.setAttribute('aria-selected', 'false');
        });
        o.setAttribute('aria-selected', 'true');
        cb.value = o.textContent.trim();
        cb.dispatchEvent(new Event('change', {bubbles: true}));
        close();
      });
    });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') close();
  });
})();
</script>

<div class="spacer"></div>
</body>
</html>
