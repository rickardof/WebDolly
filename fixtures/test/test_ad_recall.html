<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Ad study (test fixture)</title>
<style>body{font-family:sans-serif;padding:40px;max-width:700px;margin:0 auto}
fieldset{margin-bottom:24px;padding:12px 20px}label{display:block;margin:6px 0}</style></head>
<body>
<h1>Advertisement study (test fixture)</h1>
<fieldset>
  <legend>How much do you like the brand in general?</legend>
  <label><input type="radio" name="q1" value="Not at all"> Not at all</label>
  <label><input type="radio" name="q1" value="Somewhat"> Somewhat</label>
  <label><input type="radio" name="q1" value="Very much"> Very much</label>
</fieldset>
<fieldset>
  <legend>Did the advertisement display a notice that AI was involved?</legend>
  <label><input type="radio" name="q2" value="Yes"> Yes</label>
  <label><input type="radio" name="q2" value="No"> No</label>
</fieldset>
<fieldset>
  <legend>I would consider buying this product.</legend>
  <label><input type="radio" name="q3" value="Disagree"> Disagree</label>
  <label><input type="radio" name="q3" value="Neutral"> Neutral</label>
  <label><input type="radio" name="q3" value="Agree"> Agree</label>
</fieldset>
<label for="q4">How many hours a week do you work?</label>
<input type="text" id="q4">
<button type="button" id="next">Next page</button>
</body></html>
