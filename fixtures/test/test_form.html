<!DOCTYPE html>
<html>
<head>
    <title>Fara Form-Fill Test</title>
    <style>
        body { font-family: sans-serif; padding: 40px; max-width: 600px; margin: 0 auto; }
        fieldset { margin-bottom: 24px; padding: 12px 20px; }
        label { display: block; margin: 6px 0; }
        textarea { width: 100%; height: 60px; }
        select, input[type=text] { font-size: 16px; padding: 4px; }
        #q3_height_live { font-size: 12px; color: #666; }
        button { font-size: 18px; padding: 10px 24px; margin-top: 16px; }
        #done { font-size: 20px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Synthetic Survey (test fixture)</h1>

    <fieldset>
        <legend>What is your gender?</legend>
        <label><input type="radio" name="gender" value="Male"> Male</label>
        <label><input type="radio" name="gender" value="Female"> Female</label>
        <label><input type="radio" name="gender" value="Other"> Other</label>
    </fieldset>

    <fieldset>
        <legend>Which features do you use? (select all that apply)</legend>
        <label><input type="checkbox" name="features" value="Search"> Search</label>
        <label><input type="checkbox" name="features" value="Export"> Export</label>
        <label><input type="checkbox" name="features" value="Sharing"> Sharing</label>
        <label><input type="checkbox" name="features" value="API access"> API access</label>
    </fieldset>

    <label for="q5_country">Which country do you currently live in?</label>
    <select id="q5_country">
        <option value="">-- choose --</option>
        <option value="Italy">Italy</option>
        <option value="Germany">Germany</option>
        <option value="France">France</option>
        <option value="Other">Other</option>
    </select>

    <label for="q3_height">What is your height in cm?</label>
    <input type="text" id="q3_height">
    <div id="q3_height_live"></div>

    <label for="q4_comments">Any additional comments?</label>
    <textarea id="q4_comments"></textarea>

    <button id="submit-btn" onclick="document.getElementById('done').textContent='SUBMITTED';">Next</button>
    <div id="done"></div>

    <script>
        // Simulates a React-style controlled input: a "live" echo only updates
        // when a real bubbling 'input' event fires, not on a raw .value write.
        // Lets the apply script's event-dispatch behavior be verified directly,
        // without needing an actual React runtime.
        document.getElementById('q3_height').addEventListener('input', (e) => {
            document.getElementById('q3_height_live').textContent = 'live: ' + e.target.value;
        });
    </script>
</body>
</html>
