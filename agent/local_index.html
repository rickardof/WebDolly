<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Agent</title>
<style>
:root {
  --bg: #0f1117;
  --bg2: #1a1d27;
  --bg3: #252836;
  --fg: #e0e0e0;
  --fg2: #888;
  --accent: #7c6ef0;
  --accent2: #9b8afb;
  --green: #4ade80;
  --orange: #f59e0b;
  --red: #ef4444;
  --blue: #60a5fa;
  --border: #2a2d3a;
  --radius: 10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--fg);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Top bar ── */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.topbar .logo {
  font-size: 15px;
  font-weight: 600;
  color: var(--accent2);
}
.topbar .model-label {
  font-size: 12px;
  padding: 3px 8px;
  border-radius: 12px;
  background: var(--bg3);
  color: var(--fg2);
}
.topbar .model-label.active { background: var(--accent); color: #fff; }
.topbar .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--red);
  flex-shrink: 0;
}
.topbar .dot.ok { background: var(--green); }
.topbar .spacer { flex: 1; }
.topbar a {
  color: var(--fg2);
  text-decoration: none;
  font-size: 13px;
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
}
.topbar a:hover { background: var(--bg3); color: var(--fg); }
.topbar button {
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--fg);
  cursor: pointer;
}
.topbar button:hover { border-color: var(--accent); }
.topbar button:disabled { opacity: 0.4; cursor: default; }

/* ── Main layout ── */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}
.chat-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.browser-panel {
  width: 420px;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
  background: var(--bg2);
  display: flex;
  flex-direction: column;
}
.browser-panel.hidden { display: none; }
.browser-panel .header {
  padding: 8px 12px;
  font-size: 12px;
  color: var(--fg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.browser-panel .header .url {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--fg);
  font-family: monospace;
  font-size: 11px;
}
.browser-panel img {
  width: 100%;
  display: block;
  image-rendering: auto;
}
.toggle-browser {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--fg2);
  cursor: pointer;
}
.toggle-browser:hover { border-color: var(--accent); }
.think-ctrl {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--fg2);
  padding: 2px 6px;
  border: 1px solid var(--border);
  border-radius: 4px;
}
.think-ctrl select, .think-ctrl input {
  background: transparent;
  color: var(--fg);
  border: none;
  font-size: 11px;
  cursor: pointer;
}
.chats-panel {
  width: 200px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  background: var(--bg2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.chats-panel.hidden { display: none; }
.chats-panel .header {
  padding: 8px 12px;
  font-size: 12px;
  color: var(--fg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.chats-panel .header button {
  font-size: 14px;
  background: transparent;
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0 8px;
  cursor: pointer;
  line-height: 20px;
}
.chats-panel .list { flex: 1; overflow-y: auto; }
.chat-item {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  font-size: 12px;
  color: var(--fg);
  display: flex;
  align-items: center;
  gap: 6px;
}
.chat-item:hover { background: var(--bg); }
.chat-item.active { background: var(--bg); border-left: 2px solid var(--accent); }
.chat-item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-item .del { color: var(--fg2); font-size: 11px; opacity: 0; }
.chat-item:hover .del { opacity: 0.6; }
.chat-item .del:hover { opacity: 1; color: #e55; }

/* ── Messages ── */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.msg {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: var(--radius);
  line-height: 1.5;
  font-size: 14px;
  white-space: pre-wrap;
  word-wrap: break-word;
}
.msg.user {
  align-self: flex-end;
  background: var(--accent);
  color: #fff;
  border-bottom-right-radius: 3px;
}
.msg.assistant {
  align-self: flex-start;
  background: var(--bg3);
  border-bottom-left-radius: 3px;
}
.msg.assistant p { margin: 0 0 8px 0; }
.msg.assistant p:last-child { margin-bottom: 0; }
.msg.assistant h1, .msg.assistant h2, .msg.assistant h3,
.msg.assistant h4 { margin: 10px 0 6px; line-height: 1.3; }
.msg.assistant h1 { font-size: 1.3em; }
.msg.assistant h2 { font-size: 1.18em; }
.msg.assistant h3 { font-size: 1.08em; }
.msg.assistant h4 { font-size: 1.0em; font-weight: 600; }
.msg.assistant ul, .msg.assistant ol { margin: 4px 0 8px 0; padding-left: 24px; }
.msg.assistant li { margin: 2px 0; }
.msg.assistant code { background: var(--bg); padding: 1px 5px;
  border-radius: 3px; font-size: 0.9em; font-family: monospace; }
.msg.assistant pre {
  background: var(--bg); padding: 10px 12px; border-radius: 6px;
  overflow-x: auto; margin: 8px 0; font-size: 0.9em;
}
.msg.assistant pre code { background: transparent; padding: 0; }
.msg.assistant a { color: var(--accent); text-decoration: none; }
.msg.assistant a:hover { text-decoration: underline; }
.msg.assistant blockquote {
  border-left: 3px solid var(--border);
  margin: 6px 0; padding: 2px 10px; color: var(--fg2);
}
.msg.assistant hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
.msg.assistant strong { font-weight: 600; }
.msg.assistant em { font-style: italic; }
.msg.tool {
  align-self: flex-start;
  background: transparent;
  border: 1px solid var(--border);
  font-size: 12px;
  color: var(--fg2);
  max-width: 90%;
}
.msg.tool .tool-name {
  color: var(--blue);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.msg.tool .tool-content {
  margin-top: 4px;
  max-height: 200px;
  overflow-y: auto;
  font-family: monospace;
  font-size: 11px;
  white-space: pre-wrap;
}
.msg.error {
  align-self: center;
  background: transparent;
  color: var(--red);
  font-size: 12px;
}
.msg.think {
  align-self: flex-start;
  background: #0f172a;
  color: #94a3b8;
  padding: 6px 12px;
  font-size: 12px;
  max-width: 85%;
  cursor: pointer;
}
.msg.think summary {
  color: #64748b;
  font-weight: 600;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  font-size: 10px;
  user-select: none;
}
.msg.think .think-body {
  margin: 8px 0 0 0;
  max-height: 320px;
  overflow-y: auto;
  font-family: monospace;
  font-size: 11px;
  white-space: pre-wrap;
  color: #cbd5e1;
}
.thinking {
  align-self: flex-start;
  display: flex;
  gap: 4px;
  padding: 8px 14px;
}
.thinking span {
  width: 6px; height: 6px;
  background: var(--fg2);
  border-radius: 50%;
  animation: blink 1.4s infinite both;
}
.thinking span:nth-child(2) { animation-delay: 0.2s; }
.thinking span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink {
  0%, 80%, 100% { opacity: 0.2; }
  40% { opacity: 1; }
}

/* ── Input ── */
.input-bar {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  background: var(--bg2);
  display: flex;
  gap: 8px;
}
.input-bar textarea {
  flex: 1;
  resize: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg3);
  color: var(--fg);
  padding: 10px 12px;
  font-size: 14px;
  font-family: inherit;
  line-height: 1.4;
  outline: none;
  min-height: 42px;
  max-height: 150px;
}
.input-bar textarea:focus { border-color: var(--accent); }
.input-bar textarea::placeholder { color: var(--fg2); }
.input-bar button.send {
  width: 42px;
  height: 42px;
  border-radius: 8px;
  border: none;
  background: var(--accent);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.input-bar button.send:hover { background: var(--accent2); }
.input-bar button.send:disabled { opacity: 0.3; cursor: default; }
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">Local Agent</span>
  <span class="dot" id="healthDot"></span>
  <span class="model-label active" id="modelLabel">—</span>
  <span class="spacer"></span>
  <span class="think-ctrl" title="Qwen reasoning mode">
    <input type="checkbox" id="thinkOn" onchange="setThinking()">
    <label for="thinkOn">think</label>
    <select id="thinkEffort" onchange="setThinking()">
      <option value="low">low</option>
      <option value="medium" selected>medium</option>
      <option value="xhigh">high</option>
    </select>
  </span>
  <button class="toggle-browser" onclick="toggleChats()">Chats</button>
  <button class="toggle-browser" onclick="toggleBrowser()">Browser</button>
  <button id="switchBtn" onclick="switchModel()">Switch to Web Agent</button>
  <a href="/">Web Agent</a>
</div>

<div class="main">
  <div class="chats-panel" id="chatsPanel">
    <div class="header">
      <span>Chats</span>
      <button onclick="newChat()" title="New chat">+</button>
    </div>
    <div class="list" id="chatsList"></div>
  </div>
  <div class="chat-panel">
    <div class="messages" id="messages"></div>
    <div class="input-bar">
      <textarea id="input" placeholder="Send a message..." rows="1"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
      <button class="send" id="sendBtn" onclick="send()">&#x2191;</button>
      <button class="send" id="stopBtn" onclick="stopStream()" style="display:none;background:#c33" title="Stop">&#x25A0;</button>
    </div>
  </div>
  <div class="browser-panel hidden" id="browserPanel">
    <div class="header">
      <span>Browser</span>
      <span class="url" id="browserUrl">—</span>
    </div>
    <img id="browserImg" src="" alt="browser">
  </div>
</div>

<script>
const $msgs = document.getElementById('messages');
const $input = document.getElementById('input');
const $sendBtn = document.getElementById('sendBtn');
const $stopBtn = document.getElementById('stopBtn');
let currentAbort = null;
function stopStream() {
  try { fetch('/local/chat/cancel', {method:'POST'}); } catch(_){}
  if (currentAbort) { try { currentAbort.abort(); } catch(_){} }
}
const $dot = document.getElementById('healthDot');
const $label = document.getElementById('modelLabel');
const $switchBtn = document.getElementById('switchBtn');
const $browserPanel = document.getElementById('browserPanel');
const $browserImg = document.getElementById('browserImg');
const $browserUrl = document.getElementById('browserUrl');

let busy = false;
let browserVisible = false;
let browserPoll = null;

// ── Model status ──
async function checkModel() {
  try {
    const r = await fetch('/model/status');
    const d = await r.json();
    $dot.className = 'dot' + (d.healthy ? ' ok' : '');
    $label.textContent = d.label || d.active || '—';
    $switchBtn.textContent = d.active === 'qwen' ? 'Switch to Web Agent' : 'Switch to Local Agent';
  } catch(e) {
    $dot.className = 'dot';
  }
}
setInterval(checkModel, 10000);
checkModel();

async function switchModel() {
  if (busy) return;
  const r = await fetch('/model/status');
  const d = await r.json();
  const target = d.active === 'qwen' ? 'fara' : 'qwen';
  $switchBtn.disabled = true;
  $switchBtn.textContent = 'Loading ' + target + '...';
  try {
    const sr = await fetch('/model/switch', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({model: target})
    });
    const sd = await sr.json();
    if (!sd.ok) {
      alert(sd.error || 'Switch failed');
      $switchBtn.disabled = false;
      checkModel();
      return;
    }
    // Jump to the Fara UI only AFTER the model actually swapped —
    // otherwise the user lands on /fara but Qwen is still loaded.
    if (target === 'fara') {
      window.location.href = '/';
      return;
    }
    checkModel();
  } catch(e) {
    alert('Switch failed: ' + e.message);
  }
  $switchBtn.disabled = false;
  checkModel();
}

// ── Browser panel ──
function toggleBrowser() {
  browserVisible = !browserVisible;
  $browserPanel.classList.toggle('hidden', !browserVisible);
  if (browserVisible) startBrowserPoll();
  else stopBrowserPoll();
}

function startBrowserPoll() {
  stopBrowserPoll();
  refreshBrowser();
  browserPoll = setInterval(refreshBrowser, 2000);
}

function stopBrowserPoll() {
  if (browserPoll) { clearInterval(browserPoll); browserPoll = null; }
}

async function refreshBrowser() {
  if (!browserVisible) return;
  try {
    $browserImg.src = '/screen.png?t=' + Date.now();
  } catch(e) {}
}

// ── Chat ──
// Minimal, safe markdown renderer for assistant replies: escapes HTML first,
// then rewrites fenced code blocks, headings, lists, inline code, bold,
// italic, links. Keeps dependencies to zero; good enough for chat output.
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function renderMarkdown(src) {
  if (!src) return '';
  const codeBlocks = [];
  // 1. Pull fenced code blocks out first so inline rules don't touch them
  src = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    codeBlocks.push(`<pre><code>${escapeHtml(code.replace(/\n$/, ''))}</code></pre>`);
    return `\x00CODE${codeBlocks.length - 1}\x00`;
  });
  // 2. Escape remaining HTML
  src = escapeHtml(src);
  // 3. Headings (must be at line start)
  src = src.replace(/^#### (.+)$/gm, '<h4>$1</h4>')
           .replace(/^### (.+)$/gm, '<h3>$1</h3>')
           .replace(/^## (.+)$/gm, '<h2>$1</h2>')
           .replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // 4. Horizontal rule
  src = src.replace(/^---+$/gm, '<hr>');
  // 5. Blockquote (single-line simple form)
  src = src.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // 6. Lists: group consecutive bullet / numbered lines
  src = src.replace(/((?:^[-*] .+(?:\n|$))+)/gm, m => {
    const items = m.trim().split('\n').map(l =>
      `<li>${l.replace(/^[-*] /, '')}</li>`).join('');
    return `<ul>${items}</ul>`;
  });
  src = src.replace(/((?:^\d+\. .+(?:\n|$))+)/gm, m => {
    const items = m.trim().split('\n').map(l =>
      `<li>${l.replace(/^\d+\. /, '')}</li>`).join('');
    return `<ol>${items}</ol>`;
  });
  // 7. Inline code
  src = src.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  // 8. Bold then italic (bold first so **x** doesn't half-match *x*)
  src = src.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
           .replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  // 9. Links
  src = src.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  // 10. Paragraphs: wrap any remaining line groups not already in a block tag
  src = src.split(/\n{2,}/).map(block => {
    const stripped = block.trim();
    if (!stripped) return '';
    if (/^<(h\d|ul|ol|pre|blockquote|hr)/.test(stripped)) return stripped;
    return `<p>${stripped.replace(/\n/g, '<br>')}</p>`;
  }).join('\n');
  // 11. Restore code blocks
  src = src.replace(/\x00CODE(\d+)\x00/g, (_, i) => codeBlocks[+i]);
  return src;
}

function addMsg(role, content) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  if (role === 'assistant') {
    d.innerHTML = renderMarkdown(content);
  } else {
    d.textContent = content;
  }
  $msgs.appendChild(d);
  $msgs.scrollTop = $msgs.scrollHeight;
  return d;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function addToolMsg(name, content, isResult) {
  const d = document.createElement('div');
  d.className = 'msg tool';
  d.innerHTML = '<div class="tool-name">' + (isResult ? '↳ ' : '→ ') +
    name + (isResult ? ' result' : '') + '</div>' +
    '<div class="tool-content"></div>';
  const body = d.querySelector('.tool-content');
  const text = String(content || '');
  // Make /local/scratch/<file> URLs clickable; for HTML/SVG/PNG, also embed
  // an inline preview so the user actually sees what the model made.
  const urlRe = /(https?:\/\/[^\s]+\/local\/scratch\/[^\s]+)/g;
  const urls = [...text.matchAll(urlRe)].map(m => m[1]);
  body.innerHTML = escapeHtml(text).replace(urlRe,
    u => `<a href="${u}" target="_blank" style="color:#8ab4f8">${u}</a>`);
  for (const u of urls) {
    const low = u.toLowerCase().split('?')[0];
    if (low.endsWith('.html') || low.endsWith('.svg')) {
      const f = document.createElement('iframe');
      f.src = u; f.style.width = '100%'; f.style.height = '420px';
      f.style.border = '1px solid #333'; f.style.marginTop = '6px';
      f.style.background = '#fff'; d.appendChild(f);
    } else if (/\.(png|jpe?g|gif|webp)$/.test(low)) {
      const img = document.createElement('img');
      img.src = u; img.style.maxWidth = '100%'; img.style.marginTop = '6px';
      img.style.borderRadius = '6px'; d.appendChild(img);
    }
  }
  $msgs.appendChild(d);
  $msgs.scrollTop = $msgs.scrollHeight;
  return d;
}

function addThinkMsg(text) {
  const d = document.createElement('details');
  d.className = 'msg think';
  const summary = document.createElement('summary');
  summary.textContent = 'thinking · ' + text.length + ' chars';
  const body = document.createElement('pre');
  body.className = 'think-body';
  body.textContent = text;
  d.appendChild(summary);
  d.appendChild(body);
  $msgs.appendChild(d);
  $msgs.scrollTop = $msgs.scrollHeight;
  return d;
}

function addThinking() {
  const d = document.createElement('div');
  d.className = 'thinking';
  d.innerHTML = '<span></span><span></span><span></span>';
  d.id = 'thinkingIndicator';
  $msgs.appendChild(d);
  $msgs.scrollTop = $msgs.scrollHeight;
  return d;
}

function removeThinking() {
  const el = document.getElementById('thinkingIndicator');
  if (el) el.remove();
}

async function send() {
  const text = $input.value.trim();
  if (!text || busy) return;
  busy = true;
  $sendBtn.disabled = true;
  $sendBtn.style.display = 'none';
  $stopBtn.style.display = '';
  $input.value = '';
  $input.style.height = 'auto';

  addMsg('user', text);
  addThinking();

  // Auto-show browser when chatting
  if (!browserVisible) {
    browserVisible = true;
    $browserPanel.classList.remove('hidden');
    startBrowserPoll();
  }

  // Streaming NDJSON: parse the body line by line and render events as
  // they arrive so the user sees "thinking..." → tokens appearing → tool
  // calls → final markdown render, instead of a 15s wait with a static dot.
  let assistantEl = null;      // live-growing <div class="msg assistant">
  let assistantBuf = "";       // raw text we re-render as markdown each tick
  const handleEvent = (ev) => {
    if (!ev || !ev.type) return;
    if (ev.type === 'token') {
      removeThinking();
      if (!assistantEl) {
        assistantEl = addMsg('assistant', '');
      }
      assistantBuf += (ev.text || '');
      assistantEl.innerHTML = renderMarkdown(assistantBuf);
      $msgs.scrollTop = $msgs.scrollHeight;
    } else if (ev.type === 'response') {
      // Final content: canonical, overrides whatever tokens built up (the
      // server strips <think> tags and tool markup from this).
      removeThinking();
      if (!assistantEl) assistantEl = addMsg('assistant', '');
      assistantBuf = ev.content || '';
      assistantEl.innerHTML = renderMarkdown(assistantBuf);
    } else if (ev.type === 'think') {
      removeThinking();
      addThinkMsg(ev.text);
    } else if (ev.type === 'thinking') {
      // Server starting a round — ensure the typing-dots indicator shows.
      if (!document.getElementById('thinkingIndicator')) addThinking();
    } else if (ev.type === 'tool_call') {
      removeThinking();
      addToolMsg(ev.name, JSON.stringify(ev.args, null, 2), false);
      // Model may still think more after the tool returns; show dots again
      // so a long tool round is not silent.
      addThinking();
      // New round means the next content is a fresh assistant bubble.
      assistantEl = null; assistantBuf = "";
    } else if (ev.type === 'tool_result') {
      removeThinking();
      addToolMsg(ev.name, ev.result, true);
      addThinking();
    } else if (ev.type === 'browsing') {
      $browserUrl.textContent = ev.url;
      refreshBrowser();
    } else if (ev.type === 'error') {
      removeThinking();
      addMsg('error', ev.message || 'error');
    }
  };

  currentAbort = new AbortController();
  try {
    const r = await fetch('/local/chat/stream', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text}),
      signal: currentAbort.signal
    });
    if (!r.ok) {
      removeThinking();
      let err = 'HTTP ' + r.status;
      try { const j = await r.json(); if (j.error) err = j.error; } catch(_) {}
      addMsg('error', err);
    } else {
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const {value, done} = await reader.read();
        if (done) break;
        buf += decoder.decode(value, {stream: true});
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, nl).trim();
          buf = buf.slice(nl + 1);
          if (!line) continue;
          try { handleEvent(JSON.parse(line)); }
          catch(_) { /* ignore malformed line */ }
        }
      }
      removeThinking();
    }
  } catch(e) {
    removeThinking();
    if (e.name === 'AbortError') {
      addMsg('error', 'stopped');
    } else {
      addMsg('error', 'Request failed: ' + e.message);
    }
  }
  currentAbort = null;
  busy = false;
  $sendBtn.disabled = false;
  $sendBtn.style.display = '';
  $stopBtn.style.display = 'none';
  $input.focus();
  refreshBrowser();
  loadChats();
}

// Auto-resize textarea
$input.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 150) + 'px';
});

// Load existing chat history so a page refresh (or opening /local in a new
// tab) does not look like the memory was wiped. Server keeps history in
// _local_history and exposes it via /local/history.
// Split "<think>...</think> visible" into {thinking, visible} so a reloaded
// page shows past thinking as its own collapsible block, like a live reply.
function splitThink(text) {
  const parts = [];
  let visible = (text || '').replace(/<think>([\s\S]*?)<\/think>/g, (_, g) => {
    parts.push(g); return '';
  });
  const m = visible.match(/<think>([\s\S]*)$/);
  if (m) { parts.push(m[1]); visible = visible.slice(0, m.index); }
  visible = visible.trim();
  const thinking = parts.map(p => p.trim()).filter(Boolean).join('\n').trim();
  if (!visible && thinking) visible = (text || '').replace(/<\/?think>/g, '').trim();
  return {thinking, visible};
}

// ── Chats sidebar ──
const $chatsPanel = document.getElementById('chatsPanel');
const $chatsList = document.getElementById('chatsList');

function toggleChats() { $chatsPanel.classList.toggle('hidden'); }

async function loadChats() {
  try {
    const r = await fetch('/local/chats');
    const d = await r.json();
    $chatsList.innerHTML = '';
    for (const c of (d.chats || [])) {
      const row = document.createElement('div');
      row.className = 'chat-item' + (c.id === d.active ? ' active' : '');
      row.innerHTML = '<span class="title"></span><span class="del">×</span>';
      row.querySelector('.title').textContent = c.title + ' (' + c.turns + ')';
      row.onclick = (e) => {
        if (e.target.classList.contains('del')) return;
        switchChat(c.id);
      };
      row.querySelector('.del').onclick = (e) => {
        e.stopPropagation();
        deleteChat(c.id);
      };
      $chatsList.appendChild(row);
    }
  } catch(e) {}
}

async function newChat() {
  if (busy) return;
  await fetch('/local/chats/new', {method: 'POST'});
  $msgs.innerHTML = '';
  await loadChats();
}

async function switchChat(cid) {
  if (busy) return;
  await fetch('/local/chats/switch', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({chat_id: cid})
  });
  $msgs.innerHTML = '';
  await loadHistory();
  await loadChats();
}

async function deleteChat(cid) {
  if (busy) return;
  if (!confirm('Delete this chat?')) return;
  await fetch('/local/chats/delete', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({chat_id: cid})
  });
  $msgs.innerHTML = '';
  await loadHistory();
  await loadChats();
}

// ── Thinking controls ──
const $thinkOn = document.getElementById('thinkOn');
const $thinkEffort = document.getElementById('thinkEffort');

async function loadThinking() {
  try {
    const r = await fetch('/local/thinking');
    const d = await r.json();
    $thinkOn.checked = !!d.enabled;
    if (d.effort) $thinkEffort.value = d.effort;
  } catch(e) {}
}

async function setThinking() {
  try {
    await fetch('/local/thinking', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({enabled: $thinkOn.checked, effort: $thinkEffort.value})
    });
  } catch(e) {}
}

async function loadHistory() {
  try {
    const r = await fetch('/local/history');
    const d = await r.json();
    for (const m of (d.messages || [])) {
      if (m.role === 'user') addMsg('user', m.content || '');
      else if (m.role === 'tool') addToolMsg(m.name || 'tool', m.content || '', true);
      else if (m.role === 'assistant') {
        if (m.tool_calls) {
          for (const tc of m.tool_calls) {
            const fn = tc.function || {};
            addToolMsg(fn.name || 'tool', fn.arguments || '', false);
          }
        }
        const {thinking, visible} = splitThink(m.content || '');
        if (thinking) addThinkMsg(thinking);
        if (visible) addMsg('assistant', visible);
      }
    }
  } catch(e) {}
}
loadHistory();
loadChats();
loadThinking();

$input.focus();
</script>
