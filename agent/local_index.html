<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Agent</title>
<style>
:root {
  --bg: #0f1117;
  --bg2: #1a1d27;
  --bg3: #252836;
  --fg: #e0e0e0;
  --fg2: #888;
  --accent: #7c6ef0;
  --accent2: #9b8afb;
  --green: #4ade80;
  --orange: #f59e0b;
  --red: #ef4444;
  --blue: #60a5fa;
  --border: #2a2d3a;
  --radius: 10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--fg);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Top bar ── */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.topbar .logo {
  font-size: 15px;
  font-weight: 600;
  color: var(--accent2);
}
.topbar .model-label {
  font-size: 12px;
  padding: 3px 8px;
  border-radius: 12px;
  background: var(--bg3);
  color: var(--fg2);
}
.topbar .model-label.active { background: var(--accent); color: #fff; }
.topbar .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--red);
  flex-shrink: 0;
}
.topbar .dot.ok { background: var(--green); }
.topbar .spacer { flex: 1; }
.topbar a {
  color: var(--fg2);
  text-decoration: none;
  font-size: 13px;
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
}
.topbar a:hover { background: var(--bg3); color: var(--fg); }
.topbar button {
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--fg);
  cursor: pointer;
}
.topbar button:hover { border-color: var(--accent); }
.topbar button:disabled { opacity: 0.4; cursor: default; }

/* ── Main layout ── */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}
.chat-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.browser-panel {
  width: 420px;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
  background: var(--bg2);
  display: flex;
  flex-direction: column;
}
.browser-panel.hidden { display: none; }
.browser-panel .header {
  padding: 8px 12px;
  font-size: 12px;
  color: var(--fg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.browser-panel .header .url {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--fg);
  font-family: monospace;
  font-size: 11px;
}
.browser-panel img {
  width: 100%;
  display: block;
  image-rendering: auto;
}
.toggle-browser {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--fg2);
  cursor: pointer;
}
.toggle-browser:hover { border-color: var(--accent); }

/* ── Messages ── */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.msg {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: var(--radius);
  line-height: 1.5;
  font-size: 14px;
  white-space: pre-wrap;
  word-wrap: break-word;
}
.msg.user {
  align-self: flex-end;
  background: var(--accent);
  color: #fff;
  border-bottom-right-radius: 3px;
}
.msg.assistant {
  align-self: flex-start;
  background: var(--bg3);
  border-bottom-left-radius: 3px;
}
.msg.tool {
  align-self: flex-start;
  background: transparent;
  border: 1px solid var(--border);
  font-size: 12px;
  color: var(--fg2);
  max-width: 90%;
}
.msg.tool .tool-name {
  color: var(--blue);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.msg.tool .tool-content {
  margin-top: 4px;
  max-height: 200px;
  overflow-y: auto;
  font-family: monospace;
  font-size: 11px;
  white-space: pre-wrap;
}
.msg.error {
  align-self: center;
  background: transparent;
  color: var(--red);
  font-size: 12px;
}
.thinking {
  align-self: flex-start;
  display: flex;
  gap: 4px;
  padding: 8px 14px;
}
.thinking span {
  width: 6px; height: 6px;
  background: var(--fg2);
  border-radius: 50%;
  animation: blink 1.4s infinite both;
}
.thinking span:nth-child(2) { animation-delay: 0.2s; }
.thinking span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink {
  0%, 80%, 100% { opacity: 0.2; }
  40% { opacity: 1; }
}

/* ── Input ── */
.input-bar {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  background: var(--bg2);
  display: flex;
  gap: 8px;
}
.input-bar textarea {
  flex: 1;
  resize: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg3);
  color: var(--fg);
  padding: 10px 12px;
  font-size: 14px;
  font-family: inherit;
  line-height: 1.4;
  outline: none;
  min-height: 42px;
  max-height: 150px;
}
.input-bar textarea:focus { border-color: var(--accent); }
.input-bar textarea::placeholder { color: var(--fg2); }
.input-bar button.send {
  width: 42px;
  height: 42px;
  border-radius: 8px;
  border: none;
  background: var(--accent);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.input-bar button.send:hover { background: var(--accent2); }
.input-bar button.send:disabled { opacity: 0.3; cursor: default; }
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">Local Agent</span>
  <span class="dot" id="healthDot"></span>
  <span class="model-label active" id="modelLabel">—</span>
  <span class="spacer"></span>
  <button class="toggle-browser" onclick="toggleBrowser()">Browser</button>
  <button id="switchBtn" onclick="switchModel()">Switch to Web Agent</button>
  <a href="/">Web Agent</a>
</div>

<div class="main">
  <div class="chat-panel">
    <div class="messages" id="messages"></div>
    <div class="input-bar">
      <textarea id="input" placeholder="Send a message..." rows="1"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
      <button class="send" id="sendBtn" onclick="send()">&#x2191;</button>
    </div>
  </div>
  <div class="browser-panel hidden" id="browserPanel">
    <div class="header">
      <span>Browser</span>
      <span class="url" id="browserUrl">—</span>
    </div>
    <img id="browserImg" src="" alt="browser">
  </div>
</div>

<script>
const $msgs = document.getElementById('messages');
const $input = document.getElementById('input');
const $sendBtn = document.getElementById('sendBtn');
const $dot = document.getElementById('healthDot');
const $label = document.getElementById('modelLabel');
const $switchBtn = document.getElementById('switchBtn');
const $browserPanel = document.getElementById('browserPanel');
const $browserImg = document.getElementById('browserImg');
const $browserUrl = document.getElementById('browserUrl');

let busy = false;
let browserVisible = false;
let browserPoll = null;

// ── Model status ──
async function checkModel() {
  try {
    const r = await fetch('/model/status');
    const d = await r.json();
    $dot.className = 'dot' + (d.healthy ? ' ok' : '');
    $label.textContent = d.label || d.active || '—';
    $switchBtn.textContent = d.active === 'qwen' ? 'Switch to Web Agent' : 'Switch to Local Agent';
  } catch(e) {
    $dot.className = 'dot';
  }
}
setInterval(checkModel, 10000);
checkModel();

async function switchModel() {
  if (busy) return;
  const r = await fetch('/model/status');
  const d = await r.json();
  const target = d.active === 'qwen' ? 'fara' : 'qwen';
  if (target === 'fara') {
    window.location.href = '/';
    return;
  }
  $switchBtn.disabled = true;
  $switchBtn.textContent = 'Loading model...';
  try {
    const sr = await fetch('/model/switch', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({model: target})
    });
    const sd = await sr.json();
    if (sd.ok) {
      checkModel();
    } else {
      alert(sd.error || 'Switch failed');
    }
  } catch(e) {
    alert('Switch failed: ' + e.message);
  }
  $switchBtn.disabled = false;
  checkModel();
}

// ── Browser panel ──
function toggleBrowser() {
  browserVisible = !browserVisible;
  $browserPanel.classList.toggle('hidden', !browserVisible);
  if (browserVisible) startBrowserPoll();
  else stopBrowserPoll();
}

function startBrowserPoll() {
  stopBrowserPoll();
  refreshBrowser();
  browserPoll = setInterval(refreshBrowser, 2000);
}

function stopBrowserPoll() {
  if (browserPoll) { clearInterval(browserPoll); browserPoll = null; }
}

async function refreshBrowser() {
  if (!browserVisible) return;
  try {
    $browserImg.src = '/screen.png?t=' + Date.now();
  } catch(e) {}
}

// ── Chat ──
function addMsg(role, content) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = content;
  $msgs.appendChild(d);
  $msgs.scrollTop = $msgs.scrollHeight;
  return d;
}

function addToolMsg(name, content, isResult) {
  const d = document.createElement('div');
  d.className = 'msg tool';
  d.innerHTML = '<div class="tool-name">' + (isResult ? '↳ ' : '→ ') +
    name + (isResult ? ' result' : '') + '</div>' +
    '<div class="tool-content"></div>';
  d.querySelector('.tool-content').textContent = content;
  $msgs.appendChild(d);
  $msgs.scrollTop = $msgs.scrollHeight;
  return d;
}

function addThinking() {
  const d = document.createElement('div');
  d.className = 'thinking';
  d.innerHTML = '<span></span><span></span><span></span>';
  d.id = 'thinkingIndicator';
  $msgs.appendChild(d);
  $msgs.scrollTop = $msgs.scrollHeight;
  return d;
}

function removeThinking() {
  const el = document.getElementById('thinkingIndicator');
  if (el) el.remove();
}

async function send() {
  const text = $input.value.trim();
  if (!text || busy) return;
  busy = true;
  $sendBtn.disabled = true;
  $input.value = '';
  $input.style.height = 'auto';

  addMsg('user', text);
  addThinking();

  // Auto-show browser when chatting
  if (!browserVisible) {
    browserVisible = true;
    $browserPanel.classList.remove('hidden');
    startBrowserPoll();
  }

  try {
    const r = await fetch('/local/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    });
    const d = await r.json();
    removeThinking();

    if (d.error) {
      addMsg('error', d.error);
    } else {
      // Render events
      let streamEl = null;
      for (const ev of (d.events || [])) {
        if (ev.type === 'tool_call') {
          addToolMsg(ev.name, JSON.stringify(ev.args, null, 2), false);
        } else if (ev.type === 'tool_result') {
          addToolMsg(ev.name, ev.result, true);
        } else if (ev.type === 'browsing') {
          $browserUrl.textContent = ev.url;
          refreshBrowser();
        } else if (ev.type === 'error') {
          addMsg('error', ev.message);
        }
      }
      if (d.response) {
        addMsg('assistant', d.response);
      }
    }
  } catch(e) {
    removeThinking();
    addMsg('error', 'Request failed: ' + e.message);
  }
  busy = false;
  $sendBtn.disabled = false;
  $input.focus();
  refreshBrowser();
}

// Auto-resize textarea
$input.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 150) + 'px';
});

$input.focus();
</script>
</body>
</html>
